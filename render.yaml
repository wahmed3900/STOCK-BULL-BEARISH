services:
  - type: web
    name: stock-dashboard
    env: python
    plan: starter
    autoDeploy: true
    buildCommand: |
      # Install Python dependencies
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn app:app -k gevent --workers 2 --worker-connections 1000 --timeout 120 --max-requests 1000
    healthCheckPath: /api/health
    healthCheckTimeout: 5
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: RATELIMIT_DEFAULT
        value: 200 per day;50 per hour
      - key: LOG_LEVEL
        value: INFO
      - key: CACHE_TTL
        value: 300
      - key: MONGODB_DB_NAME
        value: stock_dashboard
      # Secret keys - set these in Render dashboard
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
