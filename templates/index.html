<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f6fb;
            color: #101828;
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .panel {
            background: #ffffff;
            border: 1px solid #e4e7ec;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(16, 24, 40, 0.06);
        }

        .title {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 18px;
            color: #475467;
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .ticker-input {
            flex: 1;
            min-width: 220px;
            font-size: 16px;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            padding: 12px 14px;
        }

        .analyze-btn {
            border: 0;
            background: #0b6bcb;
            color: #fff;
            font-weight: 600;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        .analyze-btn:hover {
            background: #0959a8;
        }

        #resultCard.hidden {
            display: none;
        }

        #resultCard {
            margin-top: 18px;
            border-top: 1px solid #eaecf0;
            padding-top: 18px;
        }

        #resultTicker {
            margin: 0;
            font-size: 24px;
        }

        #resultStatus {
            margin: 6px 0 14px;
            color: #667085;
            font-weight: 600;
        }

        #resultReasoning {
            margin: 0;
            white-space: pre-wrap;
            background: #f8fafc;
            border: 1px solid #eaecf0;
            border-radius: 12px;
            padding: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="panel">
            <h1 class="title">Stock Dashboard</h1>
            <p class="subtitle">Run Gemini analysis and keep live price updates flowing via SSE.</p>

            <form id="analyzeForm" class="row">
                <input id="symbol" name="symbol" class="ticker-input" placeholder="Enter ticker (AAPL, MSFT, BTC-USD)" required>
                <button type="submit" class="analyze-btn">Analyze</button>
            </form>

            <div id="resultCard" class="hidden">
                <h2 id="resultTicker">---</h2>
                <p id="resultStatus">Status: Idle</p>
                <h4>Gemini LLM Contextual Breakdown</h4>
                <p id="resultReasoning">Waiting for execution input...</p>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='frontend.js') }}"></script>
</body>
</html>
