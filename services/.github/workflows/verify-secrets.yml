name: Verify Repository Secrets

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Check if Secret exists
        env:
          MY_SECRET: ${{ secrets.YOUR_SECRET_NAME }}
        run: |
          if [ -z "$MY_SECRET" ]; then
            echo "❌ Verification Failed: Secret is empty or missing."
            exit 1
          else
            echo "✅ Verification Success: Secret is loaded properly."
          fi
