version: '3.8'
services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  web:
    build: .
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB_NAME=stock_dashboard
    ports:
      - "5001:5000"
    depends_on:
      - mongo

volumes:
  mongo-data:
